[workspace]
resolver = "2"
members = [
  "crates/o2jam-file",
  "crates/o2jam-audio",
  "crates/o2jam-game",
  "crates/o2jam-render",
  "crates/o2jam-shell",
  "crates/o2jam-net",
  "crates/recomp2jam",
  "crates/o2jam-dump",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ar-nim/recomp2jam"
authors = ["Arif Rahman Ibrahim <1311330+ar-nim@users.noreply.github.com>"]

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18"
lewton = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
winit = "0.30"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
