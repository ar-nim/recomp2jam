[package]
name = "recomp2jam"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "recomp2jam"
path = "src/main.rs"

# Development tool: lints docs/parity.md and docs/claims.md against the
# ADR rules. Not game code; the client and libraries never depend on it.
[[bin]]
name = "ledger-check"
path = "src/ledger_check.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
o2jam-game = { path = "../o2jam-game" }
o2jam-net = { path = "../o2jam-net" }
o2jam-shell = { path = "../o2jam-shell" }
o2jam-audio = { path = "../o2jam-audio" }
o2jam-file = { path = "../o2jam-file" }
winit.workspace = true
o2jam-render = { version = "0.1.0", path = "../o2jam-render" }
