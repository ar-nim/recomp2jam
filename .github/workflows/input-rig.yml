name: input-rig

on:
  push:
  pull_request:

jobs:
  x11-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config xvfb xdotool
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace
      - name: Run X11 rig + inject
        run: bash scripts/ci-input-rig.sh
